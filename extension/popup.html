<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MasterChecker</title>

    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>MasterChecker</h1>
            <p>Master's Admission Eligibility Checker</p>
        </header>

        <section>
            <h2>Your Profile</h2>

            <textarea
                id="userPrompt"
                placeholder="Describe your GPA, degree, language scores, budget, interests..."
                rows="6"
            ></textarea>
        </section>

        <section>
            <h2>Current Webpage</h2>

            <button id="readPage">
                Read Current Page
            </button>

            <p id="pageInfo">
                No page analyzed yet.
            </p>
        </section>

        <section class="parameters">
    <h2>Generation Parameters</h2>

    <div class="parameter-row">
        <label for="temperature">
            Temperature:
            <span id="temperatureValue">0.60</span>
        </label>

        <input
            type="range"
            id="temperature"
            min="0"
            max="1.2"
            step="0.1"
            value="0.6"
        >
    </div>

    <div class="parameter-row">
        <label for="topP">
            Top-p:
            <span id="topPValue">0.95</span>
        </label>

        <input
            type="range"
            id="topP"
            min="0.1"
            max="1"
            step="0.05"
            value="0.95"
        >
    </div>

    <p class="parameter-hint">
        Top-k is not supported by the current Groq API.
    </p>
</section>

        <section>
            <button id="analyzeButton" disabled>
                Check Eligibility
            </button>
        </section>

        <p id="status"></p>
        <pre id="experimentInfo"></pre>

        <section>
            <h2>Results</h2>
            <pre id="result"></pre>
        </section>

    </div>

</body>
</html>
